<!doctype html>
<html lang="km">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ប្រព័ន្ធគ្រប់គ្រងសិស្ស និងវត្តមាន (សម្រាប់លោកគ្រូ-អ្នកគ្រូ)</title>
    <!-- Prevent stale caching on GitHub Pages & mobile browsers -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <script>
      (function() {
        var APP_VER = 'v3.7_20261009_2056';
        var lastVer = localStorage.getItem('app_installed_ver');
        if (lastVer !== APP_VER) {
          localStorage.setItem('app_installed_ver', APP_VER);
          if ('caches' in window) {
            caches.keys().then(function(keys) {
              keys.forEach(function(k) { caches.delete(k); });
            });
          }
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(regs) {
              regs.forEach(function(r) { r.unregister(); });
            });
          }
        }
      })();
    </script>
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="theme-color" content="#1e40af" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="គ្រប់គ្រងវត្តមាន" />
    <!-- Google Fonts for Khmer Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:ital,wght@0,100..700;1,100..700&family=Moul&family=Battambang:wght@400;700&family=Siemreap&display=swap" rel="stylesheet">
  </head>
  <body class="bg-slate-50 text-slate-800 antialiased font-kantumruy">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
